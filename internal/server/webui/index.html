<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>overgo</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="center">
  <div class="card">
    <div><span class="wordmark"><span class="caret">&rsaquo;</span>overgo</span><span class="sub">analysis</span></div>
    <p class="tagline">Native GGUF serving and a distribution-free model-analysis workbench &mdash;
      one thin client over the Go server. All state lives in the server.</p>

    <div class="probe"><span class="dot scan" id="dot"></span><span id="probe-text">probing /health &hellip;</span></div>

    <div class="actions">
      <a class="btn" id="enter" href="/app.html" style="display:none">enter workbench</a>
      <button class="btn alt" id="retry" style="display:none" onclick="probe(true)">probe again</button>
    </div>

    <p class="note" id="hint" style="margin-top:18px; display:none">
      Server not answering. Start it: <span class="mono">go run ./cmd/server -listen 127.0.0.1:8080 &lt;model.gguf&gt;</span>
    </p>

    <div class="note" style="margin-top:26px; padding-top:16px; border-top:1px solid var(--line-soft);">
      thin client &middot; <span id="probe-count"></span>
    </div>
  </div>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let tries = 0, timer = null;

  window.probe = async function (manual) {
    tries++;
    $("probe-count").textContent = "probe #" + tries;
    if (manual) { $("dot").className = "dot scan"; $("probe-text").textContent = "probing…"; }
    try {
      const health = await fetch("/health", { signal: AbortSignal.timeout(2500) });
      if (!health.ok) throw new Error(String(health.status));
      let modelName = "";
      try {
        const models = await fetch("/models", { signal: AbortSignal.timeout(2500) });
        if (models.ok) {
          const body = await models.json();
          modelName = (body.models && body.models[0] && body.models[0].name) || "";
        }
      } catch (_) { /* /models is best-effort for the label */ }
      $("dot").className = "dot ok";
      $("probe-text").textContent = "server online" + (modelName ? " — " + modelName : "") + " — entering…";
      $("hint").style.display = "none";
      $("retry").style.display = "none";
      $("enter").style.display = "";
      clearInterval(timer);
      setTimeout(() => { location.href = "/app.html"; }, manual ? 400 : 900);
    } catch (e) {
      $("dot").className = "dot err";
      $("probe-text").textContent = "no server at " + location.origin;
      $("hint").style.display = "";
      $("retry").style.display = "";
    }
  };
  probe(false);
  timer = setInterval(() => probe(false), 4000);
})();
</script>
</body>
</html>
