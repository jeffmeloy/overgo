<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>overgo · workbench</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell front">
  <nav class="sidebar">
    <a class="brand" href="/" style="text-decoration:none"><span class="wordmark"><span class="caret">&rsaquo;</span>overgo</span><span class="sub">workbench</span></a>
    <button id="workbench-toggle" class="btn alt" title="Show or hide the workbench sections beside the conversation">Workbench</button>
    <div id="conversation-list" class="conversations" aria-label="Conversations"></div>
    <div id="sections"></div>
    <div id="tabs" style="display:none"></div>
    <div class="foot"><span class="note" id="footer-note"></span></div>
  </nav>
  <div class="content">
    <header class="topbar">
      <span class="pill" id="status-pill">probing…</span>
      <span class="dots" aria-label="status"><span id="server-dot" class="dot" title="server"></span><span id="proxy-dot" class="dot" title="swap proxy"></span><span id="device-dot" class="dot" title="device"></span></span>
      <button id="inbox-count" class="pill" hidden title="approvals waiting on you; opens the inbox">0 waiting</button>
      <button class="pill" id="model-pill" type="button" title="click to switch the served model"></button>
      <span class="note" id="model-evidence" title="Committed evidence for the served model: decode tok/s from the latest benchmark, accuracy per evaluated suite"></span>
      <span class="grow"></span>
      <input class="keyfield" id="api-key" type="password" placeholder="API key (if required)" autocomplete="off" spellcheck="false">
      <label class="key-remember" title="Keep the key in browser storage; unchecked, it is held in memory for this page only"><input type="checkbox" id="api-key-remember"> remember</label>
    </header>
    <aside id="global-operation-shell" class="operation-shell" aria-label="Operations"></aside>
    <main class="wrap"><div id="panels"></div></main>
    <aside id="inspector" class="inspector" hidden aria-label="Inspect turn"></aside>
  </div>
</div>

<!-- One shell, one loader. boot.js fetches /workspace/manifest and loads the
     shared libraries and every declared tab module itself; adding a tab is a
     manifest entry plus a file under mod/, never a line here. The shell opens
     as the front page (the conversation, workbench folded) and unfolds the
     workbench beside it on request. -->
<script defer src="/boot.js"></script>
</body>
</html>
