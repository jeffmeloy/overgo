name: fuzz

# Every fuzz target the tree holds, fuzzed a short while each day, where the
# unit job runs only their seeds.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fuzz every target
        env:
          CGO_ENABLED: "0"
        run: bash scripts/fuzz-smoke.sh 30s
