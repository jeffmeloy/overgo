name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows-amd64:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go run ./cmd/test-lane ./...
      - name: Verify compatibility claims
        env:
          CGO_ENABLED: "0"
        run: go run ./cmd/compatibility -check
      - name: Build twice and verify reproducibility
        env:
          CGO_ENABLED: "0"
        run: go run ./cmd/release -out dist -verify-reproducible
      - uses: actions/upload-artifact@v4
        with:
          name: overgo-windows-amd64
          path: |
            dist/overgo-v*-windows-amd64.zip
            dist/overgo-v*-windows-amd64.zip.sha256
          if-no-files-found: error
      - name: Verify release tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match VERSION $version"
          }
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $archive = "dist/overgo-v$version-windows-amd64.zip"
          gh release create $env:GITHUB_REF_NAME `
            $archive `
            "$archive.sha256" `
            --verify-tag `
            --generate-notes `
            --title "Overgo $env:GITHUB_REF_NAME"
