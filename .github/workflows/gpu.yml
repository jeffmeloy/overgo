name: gpu

on:
  workflow_dispatch:

jobs:
  device:
    runs-on: [self-hosted, windows, x64, gpu]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Real GPU integration lane
        env:
          CGO_ENABLED: "0"
        run: go run ./cmd/device-lane
