name: test

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Verify formatting
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l cmd internal)
          if ($LASTEXITCODE -ne 0) { throw "gofmt failed" }
          if ($unformatted.Count -ne 0) {
            throw "Go formatting check failed:`n$($unformatted -join "`n")"
          }
      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go run ./cmd/test-lane ./...
      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...
      - name: Verify SBOM
        env:
          CGO_ENABLED: "0"
        run: go run ./cmd/sbom -check
      - name: Verify kernel manifest
        env:
          CGO_ENABLED: "0"
        run: go run ./cmd/kernel-manifest
      - name: Verify compatibility claims
        env:
          CGO_ENABLED: "0"
        run: go run ./cmd/compatibility -check

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Server and inference race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/server ./internal/inference
