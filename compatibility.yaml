schema: 1
upstream:
  repository: ggml-org/llama.cpp
  commit: 42fc243060709331ff9b158a9ed2cbe37219ae83
host:
  os: windows
  arch: amd64
go:
  minimum: "1.26"
  cgo: false
claims:
  - id: bounded-gguf-parsing
    status: implemented
    summary: GGUF parsing applies allocation, count, alignment, and split limits.
    evidence:
      - path: internal/gguf/reader.go
        contains: "func OpenWithOptions("
      - path: internal/gguf/reader_test.go
        contains: "func TestParseEnforcesLimits("
  - id: bounded-server-media
    status: implemented
    summary: Multimodal requests bound encoded bodies, decoded media, dimensions, and pixels.
    evidence:
      - path: internal/server/server.go
        contains: "func validateMultimodalImages("
      - path: internal/server/server_test.go
        contains: "func TestValidateMultimodalImagesEnforcesGeometryBudgets("
  - id: validated-split-gguf
    status: implemented
    summary: Split GGUF models load, validate, write, merge, and round-trip.
    evidence:
      - path: internal/gguf/reader.go
        contains: "func splitPathPrefix("
      - path: internal/gguf/split_test.go
        contains: "func TestOpenLoadsAndReadsSplitGGUF("
  - id: pinned-quantization
    status: implemented
    summary: Quantization encoders are checked against pinned GGML references.
    evidence:
      - path: internal/quant/quantize.go
        contains: "func Quantize("
      - path: internal/quant/quantize_test.go
        contains: "func TestQuantizeMatchesPinnedGGMLReference("
  - id: serialized-cuda-worker
    status: implemented
    summary: CUDA driver work executes through one locked-thread context owner.
    evidence:
      - path: internal/cuda/device/worker.go
        contains: "func (w *Worker) Do("
      - path: internal/cuda/device/worker_windows_test.go
        contains: "func TestWorkerMemoryRoundTrip("
  - id: editable-prompt-cache
    status: implemented
    summary: Bounded prompt caches support selection, eviction, context edits, and exact media-signed replay.
    evidence:
      - path: internal/inference/prompt_cache.go
        contains: "func (r *Runner) selectPromptCache("
      - path: internal/inference/prompt_cache_test.go
        contains: "func TestProjectedPromptCacheRequiresExactMediaSignature("
  - id: constrained-generation
    status: implemented
    summary: GBNF and JSON Schema constraints match pinned upstream corpora.
    evidence:
      - path: internal/sampling/gbnf.go
        contains: "func NewGBNFGrammar("
      - path: internal/sampling/json_schema_test.go
        contains: "func TestJSONSchemaGrammarMatchesPinnedUpstreamCorpus("
  - id: ordered-multi-image
    status: implemented
    summary: Native, Chat, and Responses prompts preserve ordered image/text parts.
    evidence:
      - path: internal/projector/prompt.go
        contains: "func (r *Qwen3VLRunner) BuildImagesPrompt("
      - path: internal/server/server_part3_test.go
        contains: "func TestResponsesMultipleImagesPreservesContentOrder("
  - id: media-history
    status: implemented
    summary: Chat and Responses preserve projected images in earlier or final user turns through the complete formatted history.
    evidence:
      - path: internal/projector/prompt.go
        contains: "func (r *Gemma4Runner) BuildImagesHistoryPrompt("
      - path: internal/server/server_part2_test.go
        contains: "func TestChatImageHistoryPreservesTurnPositionAndReplay("
  - id: mixed-media-history
    status: implemented
    summary: Gemma 4 preserves ordered image/audio chunks through native, Chat, and Responses history.
    evidence:
      - path: internal/projector/prompt.go
        contains: "func (r *Gemma4Runner) BuildMediaHistoryPrompt("
      - path: internal/server/server_part2_test.go
        contains: "func TestChatMixedImageAudioPreservesChunkOrder("
  - id: bounded-remote-media
    status: implemented
    summary: Remote media is opt-in through explicit scheme, host, port, network, redirect, timeout, MIME, concurrency, and byte policy.
    evidence:
      - path: internal/server/media_policy.go
        contains: "func (f *remoteMediaFetcher) fetch("
      - path: internal/server/media_policy_test.go
        contains: "func TestRemoteMediaFetcherRejectsPrivateResolutionByDefault("
  - id: responses-file-inputs
    status: implemented
    summary: Responses accepts bounded typed inline, policy-mapped file-ID, allowlisted URL, and image file-ID inputs.
    evidence:
      - path: internal/server/resource_policy.go
        contains: "func LoadResponseFilePolicy("
      - path: internal/server/resource_policy_test.go
        contains: "func TestResponsesInputFileSources("
  - id: explicit-response-tool-policy
    status: implemented
    summary: Hosted, MCP, and free-form custom Responses tools are classified and denied unless an external executor contract is added.
    evidence:
      - path: internal/server/responses_tools.go
        contains: "by response_tools.%s policy"
      - path: internal/server/resource_policy_test.go
        contains: "func TestResponsesHostedAndCustomToolsUseExplicitPolicy("
  - id: server-encoded-video
    status: implemented
    summary: Chat and Responses decode bounded single-turn encoded video through native GIF or FFmpeg paths.
    evidence:
      - path: internal/projector/encoded_video.go
        contains: "func DecodeEncodedVideo("
      - path: internal/server/server_part3_test.go
        contains: "func TestChatAndResponsesEncodedVideoProjection("
  - id: multimodal-token-counting
    status: implemented
    summary: Chat and Responses token counts use the projected media prompt.
    evidence:
      - path: internal/server/protocol_responses.go
        contains: "func (h *Handler) responsesInputTokens("
      - path: internal/server/server_part2_test.go
        contains: "func TestMultimodalInputTokenCounting("
  - id: unified-prompt-preparation
    status: implemented
    summary: Native, Chat, and Responses generation share prepared prompts with token counting.
    evidence:
      - path: internal/server/server.go
        contains: "func (h *Handler) preparePrompt("
      - path: internal/server/server_part2_test.go
        contains: "func TestPreparedPromptGenerationAndTokenCountParity("
  - id: incremental-tool-streaming
    status: implemented
    summary: Chat, Responses, and Anthropic stream JSON and Hermes function arguments incrementally.
    evidence:
      - path: internal/inference/chat_stream.go
        contains: "func (s *chatOutputStream) Accept("
      - path: internal/server/server_part3_test.go
        contains: "func TestStreamingResponsesFunctionCallLifecycle("
  - id: multimodal-function-tools
    status: implemented
    summary: Chat, Responses, and Anthropic preserve projected image/audio history while formatting and streaming function tools.
    evidence:
      - path: internal/server/protocol_chat.go
        contains: "promptTools []inference.ChatTool"
      - path: internal/server/server_part3_test.go
        contains: "func TestChatAndResponsesMultimodalFunctionTools("
  - id: anthropic-image-input
    status: implemented
    summary: Anthropic image blocks support bounded base64, allowlisted URL, and mapped file-ID projection with token-count parity.
    evidence:
      - path: internal/server/anthropic_tools.go
        contains: "case \"image\":"
      - path: internal/server/server_part3_test.go
        contains: "func TestAnthropicImageToolsAndTokenCounting("
  - id: anthropic-local-thinking
    status: implemented
    summary: Manual summarized thinking supports buffered/SSE output, projected images, handler-local signed replay, and tamper rejection.
    evidence:
      - path: internal/server/anthropic_thinking.go
        contains: "func validateAnthropicThinking("
      - path: internal/server/server_part3_test.go
        contains: "func TestAnthropicThinkingBufferedStreamingImageAndReplay("
  - id: responses-continuation
    status: implemented
    summary: Bounded handler-local response history supports text, media, tool-call, streaming, and token-count continuations.
    evidence:
      - path: internal/server/response_history.go
        contains: "func (s *responseHistoryStore) put("
      - path: internal/server/server_part2_test.go
        contains: "func TestResponsesPreviousResponseContinuation("
  - id: responses-reasoning
    status: implemented
    summary: Responses reasoning summaries support input replay, buffered output, streaming lifecycle events, and continuation retention.
    evidence:
      - path: internal/server/protocol_responses.go
        contains: "func validateResponsesReasoning("
      - path: internal/server/server_part3_test.go
        contains: "func TestResponsesReasoningItemsBufferedAndStreaming("
  - id: architecture-profiles
    status: implemented
    summary: Model architectures use a central family and capability registry with grouped specifications.
    evidence:
      - path: internal/model/architecture.go
        contains: "func LookupArchitecture("
      - path: internal/model/architecture_test.go
        contains: "func TestArchitectureRegistryProfiles("
  - id: architecture-family-dispatch
    status: implemented
    summary: Graph construction and tensor catalog validation route through architecture families.
    evidence:
      - path: internal/model/graph_dispatch.go
        contains: "func BuildArchitectureBlockCached("
      - path: internal/model/weights_dispatch.go
        contains: "func ReadWeights("
      - path: internal/model/graph_dispatch_test.go
        contains: "func TestArchitectureBlockDispatchRoutesFamilies("
  - id: paged-continuous-cache
    status: implemented
    summary: Retained CUDA cache pages and transactional attention/recurrent/hybrid multi-sequence steps support dynamic admission and forks.
    evidence:
      - path: internal/inference/continuous_batch.go
        contains: "func (b *ContinuousBatch) Step("
      - path: internal/inference/device_cache_paging_test.go
        contains: "func TestShiftDeviceHybridCacheEditsOnlyTokenAlignedState("
  - id: padded-t5-batches
    status: implemented
    summary: Rectangular T5 batches use explicit source and decoder lengths so padding never enters attention state.
    evidence:
      - path: internal/inference/t5_batch.go
        contains: "func (r *Runner) NewT5BatchSession("
      - path: internal/inference/t5_batch_test.go
        contains: "func TestValidatePaddedTokenBatchMasksSuffixes("
  - id: reproducible-release
    status: implemented
    summary: Release archives are deterministic and compared across two builds.
    evidence:
      - path: cmd/release/main.go
        contains: "func createArchive("
      - path: cmd/release/main_test.go
        contains: "func TestCreateArchiveIsDeterministic("
gguf:
  versions:
    - 2
    - 3
  split_files:
    automatic_local_discovery: true
    first_shard_required: true
    naming: "<prefix>-%05d-of-%05d.gguf"
    validates:
      - split-index-and-count
      - global-tensor-count
      - duplicate-tensor-names
      - per-shard-bounds
    default_maximum_shards: 1024
  writing:
    versions:
      - 2
      - 3
    canonical_tensor_offsets: true
    streaming_tensor_payloads: true
    metadata_scalars_and_arrays: all
    merge_validated_splits: true
    create_validated_splits: true
    split_limits:
      - tensor-count
      - aligned-payload-bytes
    pinned_upstream_validation:
      - llama-gguf-hash
      - llama-gguf-split--merge
    payload_hashing:
      algorithms:
        - xxh64
        - sha1
        - sha256
        - llama-cpp-uuidv5
      per_tensor: true
      logical_model: true
      manifest_verification: true
    model_quantization:
      streaming: true
      default_policy: matrices-except-1d
      destinations:
        - F32
        - F16
        - BF16
        - Q1_0
        - Q2_0
        - Q4_0
        - Q4_1
        - Q5_0
        - Q5_1
        - Q8_0
        - Q2_K
        - Q3_K
        - Q4_K
        - Q5_K
        - Q6_K
        - TQ1_0
        - TQ2_0
        - IQ1_S
        - IQ1_M
        - IQ2_XXS
        - IQ2_XS
        - IQ2_S
        - IQ3_XXS
        - IQ3_S
        - IQ4_NL
        - IQ4_XS
        - MXFP4
        - NVFP4
      pinned_byte_exact_encoders:
        - Q1_0
        - Q2_0
        - Q4_0
        - Q4_1
        - Q5_0
        - Q5_1
        - Q8_0
        - Q8_1
        - Q2_K
        - Q3_K
        - Q4_K
        - Q5_K
        - Q6_K
        - Q8_K
        - TQ1_0
        - TQ2_0
        - IQ1_S
        - IQ1_M
        - IQ2_XXS
        - IQ2_XS
        - IQ2_S
        - IQ3_XXS
        - IQ3_S
        - IQ4_NL
        - IQ4_XS
        - MXFP4
        - NVFP4
      importance_matrix:
        required_destinations:
          - IQ1_S
          - IQ1_M
          - IQ2_XXS
          - IQ2_XS
        formats:
          - pinned-gguf
          - legacy-binary
        per_expert_normalization: true
        provenance_metadata: true
    overwrite_existing_output: false
  f32_compatibility_conversion:
    - F32
    - F16
    - BF16
    - F64
    - I8
    - I16
    - I32
    - I64
    - Q1_0
    - Q2_0
    - Q4_0
    - Q4_1
    - Q5_0
    - Q5_1
    - Q8_0
    - Q8_1
    - Q2_K
    - Q3_K
    - Q4_K
    - Q5_K
    - Q6_K
    - Q8_K
    - TQ1_0
    - TQ2_0
    - IQ1_S
    - IQ1_M
    - IQ2_XXS
    - IQ2_XS
    - IQ2_S
    - IQ3_XXS
    - IQ3_S
    - IQ4_NL
    - IQ4_XS
    - MXFP4
    - NVFP4
tokenizers:
  algorithms:
    - sentencepiece-bpe
    - gpt2-byte-bpe
    - gemma4-raw-bpe
    - bert-wordpiece
    - unigram
  pinned_oracle_corpora:
    - qwen2
    - qwen35
    - gpt-2
    - llama-spm
    - llama-bpe
    - bert-bge
  exact_oracle_cases: 280
  fim:
    metadata:
      - fim_pre_token_id
      - fim_suf_token_id
      - fim_mid_token_id
      - fim_pad_token_id
      - fim_rep_token_id
      - fim_sep_token_id
    deprecated_metadata:
      - prefix_token_id
      - suffix_token_id
      - middle_token_id
    fallback_token_spellings: true
sampling:
  deterministic_state: true
  filters:
    - temperature
    - dynamic-temperature
    - top-k
    - top-p
    - min-p
    - typical-p
    - top-n-sigma
    - xtc
    - repetition
    - dry
    - mirostat-v1
    - mirostat-v2
    - adaptive-p
    - infill
    - logit-bias
    - ignore-eog
  configurable_chain:
    default:
      - penalties
      - dry
      - top_n_sigma
      - top_k
      - typ_p
      - top_p
      - min_p
      - xtc
      - temperature
    repeated_stages: true
    optional:
      - adaptive_p
      - infill
  grammars:
    - exact-literal-choices
    - gbnf-character
    - json-schema-to-gbnf
  gbnf:
    features:
      - literals-and-escapes
      - unicode-character-ranges
      - negated-character-classes
      - wildcard
      - named-rules
      - groups-and-alternation
      - right-recursion
      - repetition
      - partial-utf8-token-pieces
      - numeric-token-terminals
      - named-token-terminals
      - inverse-token-terminals
      - lazy-token-triggers
      - lazy-regex-triggers
      - bounded-ecmascript-regex-triggers
      - lookahead-and-lookbehind-triggers
      - backreference-triggers
      - overlapping-token-replay
      - serialized-state
  state_version: 4
  loads_legacy_state_versions:
    - 2
    - 3
tools:
  - inspect-gguf
  - gguf-hash
  - gguf-merge
  - gguf-quantize
  - gguf-split
  - json-schema-grammar
  - tokenize
  - block-check
  - generate
  - diffusion
  - perplexity
  - embedding
  - rerank
  - benchmark
  - server
diffusion:
  architectures:
    - dream
    - llada
    - llada-moe
    - rnd1
  schedules:
    - timestep
    - block
  ranking_algorithms:
    - origin
    - entropy
    - margin
    - random
    - confidence
  classifier_free_guidance: true
  gumbel_transform: optional
  shift_logits_metadata: diffusion.shift_logits
  cancellation: context-and-callback
benchmark:
  format: json
  metrics:
    - model-and-device-identity
    - model-load-time
    - prompt-and-output-token-counts
    - time-to-first-token
    - post-first-token-decode-rate
    - end-to-end-token-rate
    - host-heap-snapshots
    - current-device-allocation
    - peak-device-allocation
    - p50-and-minimum-summaries
    - custom-kernel-launches
    - stream-synchronizations
    - host-device-copy-counts-and-bytes
    - device-device-copy-counts-and-bytes
    - stream-ordered-device-memset-counts-and-bytes
    - launches-and-synchronizations-per-output-token
  device_memory_scope: runner-owned-driver-allocations
  execution_counter_scope: runner-owned-driver-calls
hardening:
  fuzz_targets:
    - gguf-parser
    - tokenizer-encode-decode
    - gbnf-compiler
    - json-schema-converter
    - sampler-state
    - cache-state
    - session-state
    - server-json
  fuzz_smoke_script: scripts/fuzz-smoke.ps1
  race_detector:
    status: blocked
    reason: standard-go-race-detector-requires-cgo
  sbom:
    format: CycloneDX-1.6
    artifact: SBOM.cdx.json
    deterministic: true
    ci_verified: true
    kernel_sha256: true
    kernel_manifest:
      schema: 2
      abi_version: 14
      verifies:
        - source-and-asset-sha256
        - complete-entry-set
        - ordered-parameter-layouts
        - launch-and-shared-memory-conventions
      runtime_validation: fail-closed-before-module-load
      cache_invalidation: embedded-ptx-content-hash
    license_inventory: LICENSES.md
    project_license: NOASSERTION
release:
  target: windows-amd64
  cgo: false
  deterministic:
    trimpath: true
    vcs_stamp: false
    go_build_id: empty
    fixed_zip_timestamps: true
    repeated_build_comparison: true
  manifests:
    - embedded-SHA256SUMS
    - external-archive-sha256
    - CycloneDX-SBOM
    - license-inventory
    - CUDA-kernel-ABI
  workflow: .github/workflows/release.yml
  signing:
    status: blocked
    reason: no-user-controlled-code-signing-certificate
server:
  bearer_authentication: optional
  context_shift: optional
  graceful_shutdown_seconds: 30
  request_timeout: optional
  request_budgets:
    json_bytes: 1048576
    multimodal_json_bytes: 33554432
    decoded_image_bytes: 16777216
    decoded_media_bytes: 25165824
    response_resource_bytes: 16777216
    image_dimension: 16384
    image_pixels: 16777216
    request_image_pixels: 33554432
  prometheus_metrics:
    - readiness
    - request-count-and-concurrency
    - generation-count-errors-and-tokens
    - uptime
    - runner-cuda-current-bytes
    - runner-cuda-peak-bytes
    - runner-cuda-live-allocation-count
    - runner-cuda-custom-kernel-launch-count
    - runner-cuda-stream-and-context-synchronization-count
    - runner-cuda-host-device-transfer-bytes
    - runner-cuda-device-device-transfer-bytes
  stop_sequences:
    - buffered
    - streaming
    - cross-token
  multiple_choices:
    maximum: 8
    streaming: true
  chat_templates:
    - chatml
    - gemma-turns
    - llama3-headers
    - gguf-jinja-text
  gguf_jinja:
    engine: gonja-v2
    loader: memory-only
    template_max_bytes: 1048576
    output_max_bytes: 16777216
    extensions:
      - raise_exception
      - strftime_now
      - namespace
      - range
    function_input_max_bytes: 4096
    function_output_max_bytes: 4096
    context:
      - messages
      - bos_token
      - eos_token
      - add_generation_prompt
      - enable_thinking
      - tools
      - assistant-tool-calls
      - tool-results
      - documents-empty
    named_template_variants:
      - tool_use
      - rerank
    pinned_real_model_oracles:
      - qwen3
      - qwen3-tools-and-history
      - qwen35
      - qwen35-tools-and-history
      - gemma3
      - bonsai
      - bonsai-tools-and-history
  openai_chat_tools:
    routes:
      - /chat/completions
      - /v1/chat/completions
    choices:
      - auto
      - required
      - none
      - named-function
    formatting:
      - openai-function-schemas
      - assistant-tool-call-history
      - tool-result-history
      - python-style-ordered-tojson
    grammar:
      auto: lazy-tool-call-delimiter-trigger
      required: forced-schema-derived
      named_function: forced-selected-schema
    output_parsers:
      - qwen-json-in-xml
      - qwen35-bonsai-hermes-xml
    arguments:
      schema-type-coercion: true
      required-validation: true
      unknown-tool-validation: true
    response:
      generated_call_ids: true
      finish_reason: tool_calls
      empty_content: "null"
    buffered: true
    streaming:
      incremental_argument_deltas: true
      template_syntax_hidden: true
      final_finish_reason: tool_calls
    limitations:
      - arbitrary-unknown-template-output-syntax
  structured_output:
    converter: ordered-json-schema-to-gbnf
    grammar_root: root
    explicit_grammar_conflicts_rejected: true
    native_completion:
      routes:
        - /completion
        - /completions
      field: json_schema
    openai_completion:
      route: /v1/completions
      field: json_schema
    chat_completion:
      routes:
        - /chat/completions
        - /v1/chat/completions
      top_level_field: json_schema
      response_format_types:
        - text
        - json_object
        - json_schema
      wrapped_schema_field: response_format.json_schema.schema
  endpoints:
    - /health
    - /healthz
    - /v1/health
    - /metrics
    - /models
    - /v1/models
    - /v1/completions
    - /v1/chat/completions
    - /chat/completions
    - /chat/completions/input_tokens
    - /v1/chat/completions/input_tokens
    - /responses
    - /v1/responses
    - /responses/input_tokens
    - /v1/responses/input_tokens
    - /v1/messages
    - /v1/messages/count_tokens
    - /lora-adapters
    - /v1/embeddings
    - /embedding
    - /embeddings
    - /rerank
    - /reranking
    - /v1/rerank
    - /v1/reranking
    - /completion
    - /completions
    - /infill
    - /apply-template
    - /tokenize
    - /detokenize
    - /props
    - /slots
  native_infill:
    route: /infill
    layouts:
      - prefix-suffix-middle
      - suffix-prefix-middle
    mixed_prefix_suffix_tokens: true
    repository_extra_context: true
    prefix_suffix_ratio: "3:1"
    delegates_to_native_completion: true
  public_endpoints:
    - /health
    - /healthz
    - /v1/health
    - /metrics
    - /models
    - /v1/models
  model_discovery:
    envelopes:
      - models
      - data
    metadata:
      - architecture-family
      - vocabulary-type-and-count
      - context-length
      - embedding-length
      - parameter-count
      - tensor-bytes
      - quantization-level
    exposes_model_path: false
  native_embeddings:
    routes:
      - /embedding
      - /embeddings
    prompt_shapes:
      - string
      - exact-token-sequence
      - mixed-token-string-sequence
      - heterogeneous-batch
    response: indexed-nested-float-vectors
    pooling:
      - mean
      - last
      - none-per-token
    normalization:
      - none-minus-one
      - max-absolute-int16-range
      - general-p-norm
    encoding: float
  openai_embeddings:
    route: /v1/embeddings
    encoding:
      - float
      - base64-little-endian-float32
  reranking:
    routes:
      - /rerank
      - /reranking
      - /v1/rerank
      - /v1/reranking
    formats:
      - jina-results-envelope
      - tei-result-array
    sorting: descending-stable
    top_n: optional
    tei_return_text: optional
    usage: prompt-and-total-tokens
  tokenizer:
    tokenize:
      content_shapes:
        - string
        - mixed-token-string-sequence
