name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows-amd64:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: Verify compatibility claims
        env:
          CGO_ENABLED: "0"
        run: go run ./cmd/compatibility -check
      - name: Build twice and verify reproducibility
        env:
          CGO_ENABLED: "0"
        run: go run ./cmd/release -out dist -verify-reproducible
      - uses: actions/upload-artifact@v4
        with:
          name: overgo-windows-amd64
          path: |
            dist/overgo-windows-amd64.zip
            dist/overgo-windows-amd64.zip.sha256
          if-no-files-found: error
